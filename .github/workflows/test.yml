name: Tests

# Runs the unit tests on every pull request, so a broken change is caught before it is merged to main.
on:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_core.py
